<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>커뮤니티:게시글목록</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/post/list.js"></script>	
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<h1>게시글 목록</h1>
		<hr>
		<form class="input-group mb-3" onsubmit="submitSearch(event)">
         <select class="form-control" name="type" oninput="changeInput(event)">
            <option value="all">전체</option>
            <option value="title">제목</option>
            <option value="writer">작성자</option>
         </select>
           <input type="text" class="form-control" name="keyword" oninput="changeInput(event)">
           <button class="btn btn-success" type="submit">검색</button>
      </form>
      
      
		<table class="table table-hover">
			<thead>
				<tr>
					<th>번호</th>
					<th>제목</th>
					<th>작성자</th>
					<th>작성일</th>
					<th>추천/비추천</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>1</td>
					<td><a href="/post/detail.html?num=1">공지사항입니다.</a></td>
					<td>asd</td>
					<td>2026-08-20</td>
					<td>0/0</td>
				</tr>
			</tbody>
		</table>
      <ul class="pagination justify-content-center">
          <li class="page-item">
             <a class="page-link" href="javascript:void(0);" onclick="changePage(1)">이전</a>
          </li>
          <li class="page-item">
             <a class="page-link" href="javascript:void(0);" onclick="changePage(0)">1</a>
          </li>
          <li class="page-item">
             <a class="page-link" href="javascript:void(0);" onclick="changePage(2)">다음</a>
          </li>
      </ul>
		<a href="/post/insert.html" class="btn btn-outline-success btn-insert">글쓰기</a>
	</div>
</body>
</html>
