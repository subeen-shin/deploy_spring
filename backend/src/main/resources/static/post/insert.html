<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>커뮤니티:게시글</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/post/insert.js"></script>

</head>
<body>
	<app-header></app-header>
	<div class="container">
		<h1>게시글 수정</h1>
		<form id="insertForm" onsubmit="insertPost(event)">
			<!-- 게시판, 제목, 내용, 첨부파일(지금은 생략), 작성자(로그인 기능 구현 후 제거) -->
			<div class="form-group mb-3">
				<input type="text" class="form-control" name="title"
					placeholder="제목" oninput="changeInput(event)">
			</div>
			<div class="form-group mb-3">
				<select class="form-control board-list" name="boardId" oninput="changeInput(event)">
					<option value="11">게시판을 선택하세요.</option>
				</select>
			</div>
			<div class="form-group mb-3">
				<textarea class="form-control" row="10" name="content"
					placeholder="내용" oninput="changeInput(event)">
				</textarea>
			</div>
			<div class="form-group mb-3">
				<label>첨부파일</label>
			<input type="file" class="form-control" name="files">
			</div>
			
			<button class="btn btn-outline-success col-12">게시글 등록</button>
		</form>
	</div>
	
	<script></script>
	
	
</body>
</html>
