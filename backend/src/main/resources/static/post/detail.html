<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>부트:게시글</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/post/detail.js"></script>
</head>
<body>
	<app-header></app-header>
	<div class="container">
		<h1>게시글 상세</h1>
		
		<!-- 게시판, 제목, 내용, 첨부파일(지금은 생략), 작성자(로그인 기능 구현 후 제거) -->
		<div class="form-group mb-3">
			<label class="form-label">제목</label>
			<input type="text" class="form-control" readonly name="title">
		</div>
		<div class="form-group mb-3">
			<label class="form-label">작성자</label>
			<input type="text" class="form-control" readonly name="writer">
		</div>
		<div class="form-group mb-3">
			<label class="form-label">게시판</label>
			<input type="text" class="form-control" readonly name="boardName">
		</div>
		<div class="form-group mb-3">
			<label class="form-label">조회수</label>
			<input type="text" class="form-control" readonly name="view">
		</div>
		<div class="form-group mb-3">
			<label class="form-label">작성일</label>
			<input type="text" class="form-control" readonly name="createdAt">
		</div>
		<div class="mb-3 d-flex justify-content-center">
			<button class="btn btn-outline-success me-3" onclick="clickLike(1)">좋아요(<span class="up-count">0</span>)</button>
			<button class="btn btn-outline-success" onclick="clickLike(-1)">싫어요(<span class="down-count">0</span>)</button>
		</div>
		<div class="form-group mb-3">
			<label class="form-label">내용</label>
			<textarea class="form-control" rows="10" readonly name="content"></textarea>
		</div>
		<div class="form-group mb-3">
			<label>첨부파일</label>
			<div id="files">
				<a class="form-control" href="#">첨부파일</a>
			</div>
		</div>
		<div class="btns">
		<button class="btn btn-outline-danger btn-delete">삭제</button>
		<button class="btn btn-outline-warning btn-update">수정</button>
		</div>
		
		<hr>
		<h1>댓글 목록</h1>
		<ul id="comment-box">
		
		</ul>

		<ul>
            <li class="list-group-item p-3">

                <span class="fw-bold">김철수</span>
                <small class="text-muted">2026-09-02 10:15</small>

                부트스트랩 5를 사용하니 댓글 화면을 구성하기가 정말 편리하네요. 좋은 정보 감사합니다!
              </p>
            </li>
            
            <li class="list-group-item p-3 ms-4 bg-light border-start border-3 border-primary">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="fw-bold">이영희</span>
                <small class="text-muted">2026-09-02 10:20</small>
              </div>
              <p class="mb-0 text-secondary">
                맞아요, 여백 클래스를 활용하면 들여쓰기도 쉽게 구현할 수 있습니다.
              </p>
            </li>
         </ul>
         -->
         
        <ul class="pagination justify-content-center"></ul>
        <hr>
		<form class="input-group mb-5" onsubmit="sendComment(event)">
			<textarea class= "form-control" name="content"></textarea>
			<button class="btn btn-success">등록</button>
		</form>
		<!-- 
		댓글을 입력해서 등록 버튼을 클릭하면 비동기 방식으로 댓글 정보를 전송
		 -->
	</div>
	
	
</body>
</html>
