spring.application.name=community
# MySQL Datasource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_URL:localhost}:3306/community?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 32자 이상의 임의 문자열 설정
jwt.secret= your-super-secret-key-that-is-at-least-32-bytes-long
# 1시간 (밀리초)
jwt.expiration= 3600000 


# 첨부파일 경로 지정
file.path=${FILE_PATH:C:/Users/FAST/Documents/uploads/}

springdoc.swagger-ui.path=/swagger-ul.html
springdoc.api-docs.path=/v3/api/docs