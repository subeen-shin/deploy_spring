name: CI/CD with Docker

on:
  push:
    branches: [ "main" ] # main 브랜치에 push될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 코드 체크아웃
    - name: Checkout code
      uses: actions/checkout@v3

    # 5. Docker Hub 로그인
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 6. Docker 이미지 빌드 및 푸시
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME}}/sample:latest

    # 7. EC2 접속 및 배포
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 기존 컨테이너 중지 및 삭제
          sudo docker stop sample || true
          sudo docker rm sample || true
          # 최신 이미지 풀
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/sample:latest
          # 새 컨테이너 실행
          sudo docker run -d -p 80:8080 --name sample ${{ secrets.DOCKER_USERNAME }}/sample:latest
          # 미사용 이미지 삭제 (용량 확보)
          sudo docker image prune -f
